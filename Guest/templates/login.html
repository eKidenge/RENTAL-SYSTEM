{% extends 'base.html' %}
{% load static %}

{% block style %}
<style>
    /* ----- SERIOUS GOVERNMENT LOGIN STYLE ----- */
    .login-container {
        max-width: 560px;
        margin: 2rem auto 4rem;
        background: #f7f4ed;
        border: 2px solid #a38973;
        padding: 2rem 2.5rem 2.5rem;
        box-shadow: 0 12px 30px rgba(30, 30, 20, 0.10);
        border-radius: 0;
    }

    .login-container h2 {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-weight: 800;
        font-size: 2.2rem;
        letter-spacing: 0.06em;
        color: #1d3a33;
        text-transform: uppercase;
        border-bottom: 5px solid #7f6a54;
        padding-bottom: 0.6rem;
        margin-bottom: 1.8rem;
        text-align: center;
    }

    .login-container .form-group {
        margin-bottom: 1.2rem;
    }

    .login-container label {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.8rem;
        color: #1f3530;
        display: block;
        margin-bottom: 0.3rem;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background: #fcfaf6;
        border: 2px solid #84705c;
        border-radius: 0;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        color: #1e2b2c;
        transition: 0.15s;
    }

    .login-container input[type="text"]:focus,
    .login-container input[type="password"]:focus {
        border-color: #5f7a6b;
        box-shadow: 0 0 0 3px rgba(95, 122, 107, 0.25);
        background: #ffffff;
        outline: none;
    }

    .login-container .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 1rem 0 1.2rem;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 0.85rem;
        color: #2a403a;
    }

    .login-container .checkbox-group input[type="checkbox"] {
        width: 1.1rem;
        height: 1.1rem;
        accent-color: #5f7a6b;
        margin: 0;
    }

    .login-container .btn-login {
        background: #2d4f47 !important;
        border: 2px solid #1e3a32 !important;
        border-radius: 0 !important;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #fcf8f0;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        width: 100%;
        transition: 0.15s;
        cursor: pointer;
    }

    .login-container .btn-login:hover {
        background: #1a3d35 !important;
        border-color: #0f2b24 !important;
        box-shadow: 0 3px 10px rgba(30, 50, 40, 0.25);
    }

    .login-container .forgot-link {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        color: #5f7a6b;
        text-decoration: none;
        border-bottom: 2px solid transparent;
        transition: 0.1s;
    }

    .login-container .forgot-link:hover {
        border-bottom-color: #7f6a54;
        color: #1a332c;
    }

    .login-container .footer-links {
        border-top: 2px solid #d6c8b6;
        padding-top: 1.2rem;
        margin-top: 1.5rem;
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        color: #4f3f2e;
    }

    .login-container .footer-links a {
        color: #5f7a6b;
        font-weight: 700;
        text-decoration: none;
        border-bottom: 2px solid transparent;
        transition: 0.1s;
    }

    .login-container .footer-links a:hover {
        border-bottom-color: #7f6a54;
        color: #1a332c;
    }

    .login-container .msg-error {
        background: #f2e3d8;
        border-left: 6px solid #8b4c3c;
        padding: 0.7rem 1rem;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        color: #5a2d1f;
        margin-bottom: 1.2rem;
    }

    /* responsive */
    @media only screen and (max-width: 600px) {
        .login-container {
            margin: 1rem 0.5rem;
            padding: 1.5rem 1.2rem;
        }

        .login-container h2 {
            font-size: 1.6rem;
        }
    }
</style>
{% endblock %}

{% block button %}
<a class="btn btn-success navbar-signup-btn-sm" href="/register" style="margin-left: 1em;"><strong>Sign Up</strong></a>
{% endblock %}

{% block body %}
<div class="w3-container">
    <div class="login-container">
        <h2><i class="fa fa-lock" style="color: #7f6a54; margin-right: 10px;"></i>Log in</h2>

        <form action="/login" method="post">
            {% csrf_token %}

            {% if msg %}
            <div class="msg-error">
                <i class="fa fa-exclamation-triangle" style="margin-right: 8px;"></i> {{ msg }}
            </div>
            {% endif %}

            <div class="form-group">
                <label for="email"><i class="fa fa-envelope" style="margin-right: 6px;"></i>Email</label>
                <input type="text" id="email" placeholder="Enter your email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa fa-key" style="margin-right: 6px;"></i>Password</label>
                <input type="password" id="password" placeholder="Enter your password" name="password" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" checked="checked" name="remember" id="remember">
                <label for="remember" style="display: inline; text-transform: none; font-weight: 500; font-size: 0.85rem;">Remember me</label>
            </div>

            <button type="submit" class="btn-login">
                <i class="fa fa-sign-in" style="margin-right: 8px;"></i> Login
            </button>

            <div class="footer-links">
                <span>Don't have an account? <a href="/register">Sign Up</a></span>
                <span style="display: block; margin-top: 0.5rem;">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </span>
            </div>
        </form>
    </div>
</div>
{% endblock %}
